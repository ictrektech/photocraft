# Where this VOS build's core version comes from. Written by scripts/update_version.sh.
#
# core        the upstream PhotoCraft version this build is based on (Cargo.toml
#             [workspace.package] version, upstream tag v<core>)
# repo/ref    the upstream repository and the release commit the core came from (the v<core> tag;
#             image label provenance)
# base_sha    the commit this fork diverged from (merge-base with the upstream branch), which is
#             what verify-scope.sh diffs against -- not necessarily the tag's commit
# fork_build  which VOS build of this core: <core>-vos.<fork_build>
# core_bumped true when we raised the core version ourselves, so the upstream base is
#             older than the core in VERSION (then core_base names that upstream core
#             and VERSION carries it as SemVer build metadata, +up<core_base>)
core: "0.10.0"
repo: storytold/photocraft
ref: "8407d9ccb"
base_sha: "8407d9ccb"
fork_build: 1
core_bumped: false
