[package]
name = "photocraft-storage"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[dev-dependencies]
tempfile = "3"

[[test]]
name = "vos-contracts"
path = "../tests/vos_contracts.rs"
