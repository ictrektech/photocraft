# PhotoCraft for VOS — one nginx service serving the wasm site.
#
# The image is the same for every profile modulo its architecture; the two profiles exist
# only so the platform pulls the right nginx base image (see docs/vos-integration.md › Versioning).
# The image variables are rendered to full registry references at package time.

x-photocraft-web: &photocraft-web
  restart: unless-stopped
  environment:
    VOS_HOST_GW_IP: ${VOS_HOST_GW_IP:-172.17.0.1}
    VOS_API_GW_PORT_INTERNAL: ${VOS_API_GW_PORT_INTERNAL:-1182}
    VOS_API_GW_PORT_EXTERNAL: ${VOS_API_GW_PORT_EXTERNAL:-1180}
    VOS_OIDC_USERINFO_URL: ${VOS_OIDC_USERINFO_URL:-http://172.17.0.1:8105/v1000/oauth2/userinfo}
  volumes:
    - ${VOS_APP_EXPOSED_PATH:-/nonexistent}:/exposed:rslave
  networks:
    vos_default:
      aliases:
        - photocraft-web
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    # A top-level document open (someone typing the URL) goes to the platform route for the app.
    - "traefik.http.routers.photocraft-top-open.rule=PathPrefix(`/app/com.ictrek.photocraft`) && HeaderRegexp(`Sec-Fetch-Dest`, `document`)"
    - "traefik.http.routers.photocraft-top-open.priority=1000"
    - "traefik.http.routers.photocraft-top-open.service=photocraft-web"
    - "traefik.http.routers.photocraft-top-open.middlewares=photocraft-top-open-redirect"
    - "traefik.http.middlewares.photocraft-top-open-redirect.redirectregex.regex=^(https?://[^/]+)/app/com\\.ictrek\\.photocraft/?(?:\\?.*)?$"
    - "traefik.http.middlewares.photocraft-top-open-redirect.redirectregex.replacement=$${1}/#/app/com.ictrek.photocraft/photocraft"
    - "traefik.http.middlewares.photocraft-top-open-redirect.redirectregex.permanent=false"
    # The iframe itself: strip the platform prefix and serve the site, which uses relative paths.
    - "traefik.http.routers.photocraft-web.rule=PathPrefix(`/app/com.ictrek.photocraft`)"
    - "traefik.http.routers.photocraft-web.service=photocraft-web"
    - "traefik.http.routers.photocraft-web.middlewares=photocraft-web-slash,photocraft-web-strip"
    - "traefik.http.middlewares.photocraft-web-slash.redirectregex.regex=^(.*)/app/com\\.ictrek\\.photocraft$"
    - "traefik.http.middlewares.photocraft-web-slash.redirectregex.replacement=$${1}/app/com.ictrek.photocraft/"
    - "traefik.http.middlewares.photocraft-web-slash.redirectregex.permanent=true"
    - "traefik.http.middlewares.photocraft-web-strip.stripprefix.prefixes=/app/com.ictrek.photocraft"
    - "traefik.http.services.photocraft-web.loadbalancer.server.port=8080"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
    interval: 30s
    timeout: 10s
    start_period: 10s
    retries: 3

services:
  photocraft-web-amd:
    <<: *photocraft-web
    profiles: ["amd"]
    image: ${PHOTOCRAFT_WEB_AMD_IMAGE}
    pull_policy: always

  photocraft-web-arm:
    <<: *photocraft-web
    profiles: ["arm"]
    image: ${PHOTOCRAFT_WEB_ARM_IMAGE}
    pull_policy: always

networks:
  vos_default:
    external: true
