# =============================================================================
# PhotoCraft — 前端导航路由
# VOS 应用抽屉按应用分组，主页与 API 文档为组内同级页面。
# =============================================================================

router-type: structured

routers:
  - id: photocraft
    kind: page
    title:
      zh-CN: PhotoCraft
      en: PhotoCraft
    icon: lucide:image
    order: 220
    iframe-src: /app/com.ictrek.photocraft/?v=__APP_VERSION__
    keep-alive: true
    entry-point: true
    embed: true
  - id: photocraft-api
    kind: page
    title: {zh-CN: API 文档, en: API documentation}
    icon: lucide:book-open
    order: 221
    iframe-src: /app/com.ictrek.photocraft/api-guide.html
    keep-alive: true
    embed: true
