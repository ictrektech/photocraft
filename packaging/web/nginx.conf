worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # All runtime writes go to /tmp, allowing a read-only container filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Precompressed at build time; uncompressed clients receive the original.
    gzip_static on;
    gzip_vary on;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Trunk gives these files content hashes. Missing assets must be 404s,
        # never an HTML fallback or an error cached for a year.
        location ~ \.(wasm|js)$ {
            types { application/wasm wasm; text/javascript js; }
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Fonts served next to the app (packaging/web/README.md › Fonts). Both revalidate: neither
        # name changes with its contents.
        location = /fonts/manifest.txt {
            types { text/plain txt; }
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # The font types nginx's mime.types does not map; a `.gz` next to one is served by
        # gzip_static above.
        location /fonts/ {
            types {
                font/otf otf;
                font/ttf ttf;
                font/ttc ttc;
            }
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location /storage/ {
            client_max_body_size 256m;
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $http_host;
            proxy_read_timeout 120s;
            add_header Cache-Control no-store always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
