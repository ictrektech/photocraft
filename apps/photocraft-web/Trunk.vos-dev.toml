# Trunk configuration for local VOS development.
# Trunk resolves build and hook paths relative to this config file.
# Release image builds use Trunk.toml.

[build]
target = "index.html"
# Separate from the release output (dist/web).
dist = "../../dist/web-dev"
public_url = "./"
filehash = true
# Select the dev Cargo profile; Trunk skips wasm-opt when release is false.
release = false

[serve]
addresses = ["127.0.0.1"]
port = 8765

# Watch workspace source and build files; ignore generated output directories.
[watch]
watch = ["../../crates", "../../apps", "../../xtask", "../../Cargo.toml", "../../Cargo.lock"]
ignore = ["../../target", "../../dist"]

# Both hooks read TRUNK_STAGING_DIR from the environment: trunk builds into dist/web-dev/.stage and
# moves it into place only after these finish. Trunk runs the post_build hooks CONCURRENTLY, so they
# must not touch the same files: compress rewrites index.html (and its .gz) and writes every .gz,
# while fonts only adds files under fonts/.
[[hooks]]
stage = "post_build"
command = "bash"
# Substitutes trunk's auto-reload placeholders in index.html, then precompresses every file so
# nginx's gzip_static has a .gz to serve.
command_arguments = ["../../scripts/vos-dev.sh", "compress"]

[[hooks]]
stage = "post_build"
command = "bash"
# Copies the configured fonts into the built site.
command_arguments = ["../../scripts/vos-fonts.sh"]
