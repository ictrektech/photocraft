# PhotoCraft web (wasm) served by nginx — community self-hosting recipe.
#
#   docker compose -f docker/docker-compose.yml up --build
#   → http://localhost:8080/
#
# The build context is the repository root (the Dockerfile COPYs the whole workspace),
# so run from anywhere with -f docker/docker-compose.yml, or cd into this directory and
# use `docker compose up --build`.
#
# Source of truth for the build: docker/Dockerfile.vos (see also packaging/web/README.md).
#
# docker/Dockerfile.vos starts FROM the toolchain image built by docker/build_toolchain.sh (Rust +
# wasm32 target + trunk + wasm-bindgen-cli + wasm-opt). That image is not on Docker Hub: build and
# publish it once with docker/build_toolchain.sh, or point TOOLCHAIN_IMAGE at a locally tagged one.

services:
  photocraft-web:
    build:
      context: ..
      # The VOS image recipe: trunk, wasm-bindgen-cli and wasm-opt come from the toolchain image
      # instead of being compiled or downloaded here (GitHub is blocked on some networks), and cargo
      # uses the Tsinghua crates.io mirror. Keep WASM_BINDGEN_VERSION in sync with Cargo.lock and
      # TRUNK_VERSION with .github/workflows/ci.yml / release.yml: every version below, plus the two
      # network knobs, is part of the toolchain tag (docker/toolchain_tag.sh).
      dockerfile: docker/Dockerfile.vos
      args:
        # Pin the toolchain explicitly, so compose does not have to guess the tag from the version
        # ARGs below. Override with e.g.
        #   TOOLCHAIN_IMAGE=photocraft-toolchain:local docker compose up --build
        TOOLCHAIN_IMAGE: ${TOOLCHAIN_IMAGE:-}
        RUST_VERSION: ${RUST_VERSION:-1.99}
        TRUNK_VERSION: ${TRUNK_VERSION:-0.21.14}
        WASM_BINDGEN_VERSION: ${WASM_BINDGEN_VERSION:-0.2.129}
        WASM_OPT_VERSION: ${WASM_OPT_VERSION:-version_123}
        CARGO_REGISTRY_MIRROR: ${CARGO_REGISTRY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/}
        GITHUB_ACCELERATOR: ${GITHUB_ACCELERATOR:-https://gh-proxy.com/}
    image: photocraft-web:local
    container_name: photocraft-web
    ports:
      - "${PHOTOCRAFT_WEB_PORT:-48040}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
